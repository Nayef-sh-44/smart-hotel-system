services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smarthotel-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - smarthotel-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarthotel-backend
    restart: always
    environment:
      PORT: 5000
      DOCKER_ENV: "true"
      DB_HOST: "sqlserver"
      DB_PORT: 1433
      DB_USER: "sa"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "HotelBookingDB"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - smarthotel-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smarthotel-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - smarthotel-network

volumes:
  sqlserver-data:
    name: smarthotel-sqlserver-data

networks:
  smarthotel-network:
    name: smarthotel-network
    driver: bridge
